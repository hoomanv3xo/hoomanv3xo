<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWhite" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="url(#bg)"/>

  <!-- neon glow accents -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="#39ff14" stroke-width="3" filter="url(#glowGreen)" opacity="0.9"/>
  <line x1="0" y1="162" x2="1200" y2="162" stroke="#ff2b2b" stroke-width="3" filter="url(#glowRed)" opacity="0.9"/>

  <circle cx="80" cy="90" r="26" fill="none" stroke="#39ff14" stroke-width="3" filter="url(#glowGreen)" opacity="0.85"/>
  <circle cx="1120" cy="90" r="26" fill="none" stroke="#ff2b2b" stroke-width="3" filter="url(#glowRed)" opacity="0.85"/>
  <rect x="55" y="65" width="50" height="50" fill="none" stroke="#ffffff" stroke-width="1.5" filter="url(#glowWhite)" opacity="0.4" transform="rotate(45 80 90)"/>
  <rect x="1095" y="65" width="50" height="50" fill="none" stroke="#ffffff" stroke-width="1.5" filter="url(#glowWhite)" opacity="0.4" transform="rotate(45 1120 90)"/>

  <text x="600" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="34" font-weight="bold" fill="#ffffff" filter="url(#glowWhite)" letter-spacing="4">SELECTED PROJECTS</text>
  <text x="600" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#39ff14" filter="url(#glowGreen)" letter-spacing="3">root@hooman:~$ ls ./projects --verbose</text>
</svg>
